name: clinic-pos-system

services:
  # Database
  db:
    image: postgres:15-alpine
    container_name: clinic_db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=clinic_pos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d clinic_pos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache
  redis:
    image: redis:alpine
    container_name: clinic_redis
    ports:
      - "6379:6379"

  # Messaging
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: clinic_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  # Backend App
  backend:
    build: ./backend
    container_name: clinic_backend
    ports:
      - "5268:5268"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=clinic_pos;Username=admin;Password=password123
      - Redis__Configuration=redis:6379

  # Frontend App
  frontend:
    build: ./frontend
    container_name: clinic_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5268

volumes:
  postgres_data: